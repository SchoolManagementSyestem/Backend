version: "3"
services:
  main-service:
    build: ./cmd/main-service
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      - user-service
      - product-service

  user-service:
    build: ./cmd/user-service
    ports:
      - "8081:8081"

  product-service:
    build: ./cmd/product-service
    ports:
      - "8082:8082"
