syntax = "proto3";

package user;

option go_package = "github.com/sumonskys/schoolManagementSystem/protos/user;userpb";

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
}

message UserRequest {
  string userId = 1;
}

message UserResponse {
  string name = 1;
  string email = 2;
}
