syntax = "proto3";

package auth;

option go_package = "schoolManagementSystem/protos/auth;authpb";

service AuthService {
  rpc LoginUser (LoginRequest) returns (LoginResponse);
  rpc LoginStaff (LoginRequest) returns (LoginResponse);
  rpc LoginAdmin (LoginRequest) returns (LoginResponse);
}

// Request for login
message LoginRequest {
  string uid = 1;
  string password = 2;
  string tenantId = 3;
}

// Response for login
message LoginResponse {
  bool status = 1;
  string message = 2;
  LoginResponseData data = 3;
}

// Detailed login response data
message LoginResponseData {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  string dateOfBirth = 6;
  string gender = 7;
  string address = 8;
  string status = 9;
  string profilePicture = 10;
  string createdAt = 11;
  string updatedAt = 12;
  string deletedAt = 13;
  string role = 14;
  Token token = 15;
}

// Token structure for access and refresh tokens
message Token {
  string accessToken = 1;
  string refreshToken = 2;
}
